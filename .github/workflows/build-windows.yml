name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compilar ejecutable con PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "ProExtrusion_Gestor" main.py

    - name: Subir EXE como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ProExtrusion_Gestor_Windows
        path: dist/ProExtrusion_Gestor.exe
